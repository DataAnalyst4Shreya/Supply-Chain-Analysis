<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <style>
      @keyframes drawLine {
        from { stroke-dashoffset: 3000; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes dotPulse {
        0%, 100% { r: 3; opacity: 0.8; }
        50% { r: 5; opacity: 1; }
      }
      .chart-line {
        stroke-dasharray: 3000;
        stroke-dashoffset: 3000;
        animation: drawLine 3.5s ease-out forwards;
      }
      .ma-line {
        stroke-dasharray: 3000;
        stroke-dashoffset: 3000;
        animation: drawLine 3.5s ease-out 0.5s forwards;
      }
      .fade { animation: fadeIn 1s ease-out forwards; }
      .fade1 { animation: fadeIn 0.8s ease-out 0.2s both; }
      .fade2 { animation: fadeIn 0.8s ease-out 3.6s both; }
      .pulse { animation: dotPulse 2s ease-in-out 3.5s infinite; }
    </style>

    <!-- Area gradient -->
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Clip path for chart area -->
    <clipPath id="chartClip">
      <rect x="72" y="20" width="700" height="330"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0f172a" rx="12"/>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="800" height="3" rx="2" fill="url(#topBar)"/>
  <defs>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="72" y="18" font-family="monospace" font-size="12" fill="#64748b" class="fade1">● EXECUTION ANALYTICS</text>
  <text x="72" y="398" font-family="monospace" font-size="11" fill="#475569" class="fade1">Plan Date →</text>
  <text x="16" y="200" font-family="monospace" font-size="11" fill="#475569" transform="rotate(-90,16,200)" class="fade1">Efficiency (%)</text>

  <!-- Grid lines -->
  <g stroke="#1e2d40" stroke-width="0.5" class="fade1">
    <line x1="72" y1="50"  x2="772" y2="50"/>
    <line x1="72" y1="132" x2="772" y2="132"/>
    <line x1="72" y1="215" x2="772" y2="215"/>
    <line x1="72" y1="297" x2="772" y2="297"/>
    <line x1="72" y1="350" x2="772" y2="350"/>
  </g>

  <!-- Y-axis labels -->
  <g font-family="monospace" font-size="11" fill="#475569" text-anchor="end" class="fade1">
    <text x="66" y="54">350</text>
    <text x="66" y="136">280</text>
    <text x="66" y="219">210</text>
    <text x="66" y="301">140</text>
    <text x="66" y="354">100</text>
  </g>

  <!-- X-axis labels -->
  <g font-family="monospace" font-size="11" fill="#475569" text-anchor="middle" class="fade1">
    <text x="72"  y="378">Feb</text>
    <text x="212" y="378">Mar</text>
    <text x="352" y="378">Apr</text>
    <text x="492" y="378">May</text>
    <text x="632" y="378">Jun</text>
    <text x="772" y="378">Jul</text>
  </g>

  <!-- Axes -->
  <line x1="72" y1="20" x2="72" y2="355" stroke="#1e2d40" stroke-width="1"/>
  <line x1="72" y1="355" x2="772" y2="355" stroke="#1e2d40" stroke-width="1"/>

  <!-- Area fill (animated clip) -->
  <g clip-path="url(#chartClip)">
    <polygon class="chart-line"
      fill="url(#areaGrad)" stroke="none"
      points="
        72,354 86,200 100,270 114,154 128,215
        142,288 156,180 170,265 184,175 198,354
        212,300 226,224 240,295 254,180 268,354
        282,230 296,265 310,285 324,354 338,220
        352,148 366,225 380,175 394,250 408,265
        422,280 436,220 450,185 464,240 478,354
        492,230 506,265 520,280 534,200 548,180
        562,265 576,290 590,260 604,220 618,200
        632,265 646,300 660,354 674,200 688,230
        702,215 716,260 730,230 744,200 758,258
        772,354 772,354 72,354"
    />
  </g>

  <!-- Main line -->
  <polyline class="chart-line"
    fill="none"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    clip-path="url(#chartClip)"
    points="
      72,200 86,154 100,175 114,180 128,225
      142,265 156,185 170,175 184,220 198,290
      212,200 226,148 240,215 254,175 268,300
      282,195 296,225 310,240 324,290 338,170
      352,148 366,200 380,175 394,215 408,240
      422,260 436,185 450,145 464,205 478,280
      492,185 506,220 520,240 534,175 548,165
      562,220 576,250 590,215 604,185 618,175
      632,220 646,260 660,290 674,150 688,195
      702,170 716,250 730,195 744,155 758,210"
  />

  <!-- Moving average line -->
  <polyline class="ma-line"
    fill="none"
    stroke="#f472b6"
    stroke-width="1.8"
    stroke-dasharray="6 4"
    stroke-linejoin="round"
    stroke-linecap="round"
    clip-path="url(#chartClip)"
    points="
      72,215 114,210 156,205 198,200 240,205
      282,208 324,212 366,200 408,205 450,195
      492,200 534,198 576,205 618,200 660,208
      702,200 744,195 758,200"
  />

  <!-- Peak marker -->
  <circle cx="352" cy="148" r="5" fill="#f87171" class="fade2"/>
  <line x1="352" y1="130" x2="352" y2="143" stroke="#f87171" stroke-width="1" class="fade2"/>
  <text x="352" y="124" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle" class="fade2">341%</text>

  <!-- Pulse dot at last point -->
  <circle cx="758" cy="210" r="3" fill="#38bdf8" class="pulse"/>

  <!-- Stats bar -->
  <rect x="72" y="25" width="700" height="0" fill="none"/>

  <!-- Legend -->
  <g class="fade2">
    <rect x="580" y="30" width="10" height="10" rx="2" fill="#38bdf8"/>
    <text x="596" y="40" font-family="monospace" font-size="11" fill="#94a3b8">Efficiency</text>
    <line x1="650" y1="35" x2="670" y2="35" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="676" y="40" font-family="monospace" font-size="11" fill="#94a3b8">7-day MA</text>
  </g>

  <!-- Stat chips -->
  <g class="fade2">
    <rect x="72" y="30" width="68" height="20" rx="4" fill="#1e293b"/>
    <text x="106" y="44" font-family="monospace" font-size="10" fill="#f87171" text-anchor="middle">↑ peak 341%</text>

    <rect x="148" y="30" width="68" height="20" rx="4" fill="#1e293b"/>
    <text x="182" y="44" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">↓ low 139%</text>

    <rect x="224" y="30" width="66" height="20" rx="4" fill="#1e293b"/>
    <text x="257" y="44" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">~ avg 228%</text>
  </g>
</svg>
